<!DOCTYPE html><html lang="id" style="width: 1280px; height: 742px; overflow: hidden; position: relative;"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SARPRA - Masuk ke Sistem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#1e3a5f',
              navyHover: '#152943',
              dark: '#0f172a',
              slate: '#475569',
              lightSlate: '#64748b',
              border: '#e2e8f0',
              inputBorder: '#cbd5e1',
              bg: '#f8fafc',
              errorBg: '#fef2f2',
              errorBorder: '#f87171',
              errorText: '#b91c1c'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #f8fafc;
      background-image: 
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(30, 58, 95, 0.05), transparent),
        linear-gradient(to right, #edf2f7 1px, transparent 1px),
        linear-gradient(to bottom, #edf2f7 1px, transparent 1px);
      background-size: 100% 100%, 48px 48px, 48px 48px;
    }
  </style>
</head>
<body class="min-h-screen font-sans text-brand-dark flex flex-col justify-between items-center p-4 sm:p-6 antialiased selection:bg-brand-navy selection:text-white">

  <!-- Main Content Center -->
  <main class="w-full flex-1 flex flex-col items-center justify-center my-6">
    <div class="w-full max-w-[440px] bg-white rounded-2xl border border-brand-border shadow-[0_8px_30px_rgb(15,23,42,0.06)] overflow-hidden transition-all duration-300">
      
      <!-- Top Decorative Accent -->
      <div class="h-1.5 w-full bg-gradient-to-r from-brand-navy via-[#2d5587] to-brand-navy"></div>

      <div class="p-8 sm:p-10">
        <!-- Brand Header & Icon -->
        <div class="flex flex-col items-center text-center mb-6">
          <div class="w-16 h-16 rounded-2xl bg-[#1E3A5F] flex items-center justify-center shadow-md shadow-brand-navy/20 mb-4 ring-4 ring-brand-navy/5 p-2 relative overflow-hidden group">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="w-full h-full" fill="none">
    <rect width="120" height="120" rx="28" fill="#1E3A5F"></rect>
    <rect x="26" y="56" width="28" height="38" rx="6" fill="#3B82F6" fill-opacity="0.9"></rect>
    <rect x="58" y="32" width="36" height="62" rx="6" fill="#FFFFFF"></rect>
    <path d="M68 44H84M68 54H84M68 64H84M68 74H78" stroke="#1E3A5F" stroke-width="3" stroke-linecap="round"></path>
    <path d="M34 66H46M34 76H46" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"></path>
    <circle cx="76" cy="24" r="5" fill="#38BDF8"></circle>
  </svg>
</div>
          
          <div class="inline-flex items-center gap-1.5 px-3 py-1 bg-slate-100 rounded-full mb-2 border border-slate-200/80">
            <span class="w-1.5 h-1.5 rounded-full bg-brand-navy"></span>
            <span class="text-[11px] font-semibold tracking-wider uppercase text-brand-slate">Sistem Pengelolaan Sarana &amp; Prasarana</span>
          </div>

          <h1 class="text-2xl font-bold text-brand-dark tracking-tight">Masuk ke Sistem</h1>
          <p class="text-sm text-brand-slate mt-1 font-normal">Kelola sarana dan prasarana terpadu</p>
        </div>

        <!-- Validation Error Alert (as seen in mockup) -->
        <div id="validation-alert" class="flex items-start gap-3 p-3.5 mb-6 bg-brand-errorBg border-l-4 border-l-brand-errorText border border-brand-errorBorder/40 rounded-lg relative transition-all">
          <span class="material-symbols-outlined text-brand-errorText text-[20px] shrink-0 mt-0.5">error</span>
          <div class="flex-1 pr-2">
            <p class="text-xs font-semibold text-brand-errorText">Kredensial tidak valid</p>
            <p class="text-xs text-brand-errorText/90 mt-0.5 leading-relaxed">Username/email atau kata sandi yang Anda masukkan salah. Silakan coba lagi.</p>
          </div>
          <button type="button" onclick="document.getElementById('validation-alert').style.display='none'" class="text-brand-errorText/70 hover:text-brand-errorText transition-colors p-0.5 rounded" aria-label="Tutup notifikasi">
            <span class="material-symbols-outlined text-[18px]">close</span>
          </button>
        </div>

        <!-- Login Form -->
        <form class="space-y-4" onsubmit="event.preventDefault();">
          
          <!-- Username / Email Field -->
          <div>
            <label for="identity" class="block text-xs font-semibold text-brand-slate uppercase tracking-wider mb-1.5">
              Username / Email <span class="text-red-500">*</span>
            </label>
            <div class="relative flex items-center">
              <span class="material-symbols-outlined absolute left-3.5 text-brand-lightSlate text-[20px] pointer-events-none">account_circle</span>
              <input id="identity" name="identity" type="text" placeholder="Masukkan username atau email" required="" class="w-full pl-11 pr-4 py-3 bg-white border border-brand-inputBorder rounded-xl text-sm text-brand-dark placeholder:text-slate-400 focus:outline-none focus:border-brand-navy focus:ring-4 focus:ring-brand-navy/10 transition duration-150">
            </div>
          </div>

          <!-- Password Field -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label for="password" class="block text-xs font-semibold text-brand-slate uppercase tracking-wider">
                Kata Sandi <span class="text-red-500">*</span>
              </label>
            </div>
            <div class="relative flex items-center">
              <span class="material-symbols-outlined absolute left-3.5 text-brand-lightSlate text-[20px] pointer-events-none">lock</span>
              <input id="password" name="password" type="password" placeholder="Masukkan kata sandi" required="" class="w-full pl-11 pr-11 py-3 bg-white border border-brand-inputBorder rounded-xl text-sm text-brand-dark placeholder:text-slate-400 focus:outline-none focus:border-brand-navy focus:ring-4 focus:ring-brand-navy/10 transition duration-150">
              <button type="button" id="toggle-btn" onclick="togglePassword()" class="absolute right-3.5 text-brand-lightSlate hover:text-brand-dark transition-colors p-1 flex items-center justify-center rounded" aria-label="Tampilkan atau sembunyikan kata sandi">
                <span id="password-icon" class="material-symbols-outlined text-[20px]">visibility</span>
              </button>
            </div>
          </div>

          <!-- Auxiliary Options -->
          <div class="flex items-center justify-between pt-1">
            <label class="flex items-center gap-2 cursor-pointer select-none">
              <input type="checkbox" name="remember" class="w-4 h-4 rounded text-brand-navy border-slate-300 focus:ring-brand-navy/20 accent-brand-navy cursor-pointer">
              <span class="text-xs text-brand-slate font-medium">Ingat saya</span>
            </label>
            <a href="#" class="text-xs font-semibold text-brand-navy hover:underline underline-offset-2 transition-colors">
              Lupa Password?
            </a>
          </div>

          <!-- Submit CTA Button -->
          <div class="pt-2">
            <button type="submit" class="w-full py-3.5 px-4 bg-brand-navy hover:bg-brand-navyHover text-white text-sm font-semibold rounded-xl shadow-md shadow-brand-navy/20 hover:shadow-lg transition-all duration-200 flex items-center justify-center gap-2 group active:scale-[0.99]">
              <span class="">Masuk</span>
              <span class="material-symbols-outlined text-[18px] transition-transform duration-200 group-hover:translate-x-0.5">arrow_forward</span>
            </button>
          </div>

        </form>
      </div>

    </div>

    <!-- Footer Copyright Notice -->
    <footer class="mt-6 text-center text-xs text-brand-lightSlate">
      <p class="">© 2026 SARPRA — Sistem Pengelolaan Sarana dan Prasarana</p>
    </footer>
  </main>

  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('password-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility';
      }
    }
  </script>




<div id="snapdom-sandbox" data-snapdom-sandbox="true" aria-hidden="true" style="position: absolute; left: -9999px; top: -9999px; width: 0px; height: 0px; overflow: hidden;"></div></body></html>
